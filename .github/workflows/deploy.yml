name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (SQLite dev schema, no production DB needed)
        env:
          DATABASE_URL: 'file:./prisma/ci.db'
          NEXTAUTH_SECRET: 'ci-placeholder-secret'
          NEXT_PUBLIC_SITE_URL: 'https://example.com'
        run: |
          npx prisma generate --schema prisma/schema.dev.prisma
          npm run build

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build for production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          npx prisma generate --schema prisma/schema.prisma
          npm run build
      - name: Preparar clave SSH
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
      - name: Sincronizar archivos (rsync)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules/.cache' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$SSH_USER@$SSH_HOST:$APP_PATH"
      - name: Instalar dependencias en el servidor
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd $APP_PATH && npm ci --omit=dev"
      - name: Sincronizar esquema de base de datos
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd $APP_PATH && npx prisma db push --schema prisma/schema.prisma"
      - name: Importar calendario y equipos UCI
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd $APP_PATH && npx tsx prisma/import-uci-data.ts"
      - name: Importar ciclistas UCI
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd $APP_PATH && npx tsx prisma/import-uci-riders.ts"
      - name: Publicar artículo de la Vuelta (temporal, un solo uso)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd $APP_PATH && npx tsx prisma/publish-vuelta-stage19-article.ts"
      - name: Reiniciar aplicación
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "cd $APP_PATH && mkdir -p tmp && touch tmp/restart.txt"
